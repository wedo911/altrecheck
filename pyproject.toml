[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "altrecheck"
version = "0.1.0"
description = "Flag changed images whose alternative text was not reviewed."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "AltRecheck contributors" }]
keywords = ["accessibility", "alt-text", "git", "ci", "wcag"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
test = [
  "build>=1.2,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
altrecheck = "altrecheck.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/altrecheck"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=altrecheck --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
